# docker-compose.yml

services:
  ircart:
    container_name: ircart
    build: .
    user: "1001:1001"
    env_file: .env
    environment:
      REPO: /art
      DATA: /data
    volumes:
      - ./art:/art
      - ./data:/data
    ports:
      - "127.0.0.1:9009:9009"
    restart: unless-stopped
