<!-- templates/index.html -->

<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ title }}</title>
	<meta name="description" content="{{ description }}">
	<meta name="robots" content="{{ robots }}">
	<link rel="canonical" href="{{ canonical }}">
	<meta name="theme-color" content="#0b0b0b">
	<meta property="og:site_name" content="IRCart">
	<meta property="og:type" content="website">
	<meta property="og:title" content="{{ title }}">
	<meta property="og:description" content="{{ description }}">
	<meta property="og:url" content="{{ canonical }}">
	<meta property="og:image" content="{{ site }}/static/og.png">
	<meta property="og:image:width" content="1200">
	<meta property="og:image:height" content="630">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="{{ title }}">
	<meta name="twitter:description" content="{{ description }}">
	<meta name="twitter:image" content="{{ site }}/static/og.png">
	<link rel="icon" href="/static/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
	<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
	<link rel="manifest" href="/static/manifest.webmanifest">
	<meta name="apple-mobile-web-app-title" content="IRCart">
	{% if jsonld %}<script type="application/ld+json">{{ jsonld | safe }}</script>{% endif %}
	<link rel="stylesheet" href="/static/palette.css">
	<link rel="stylesheet" href="/static/style.css">
</head>
<body>
	<!-- icons: Lucide (ISC license, https://lucide.dev) -->
	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<defs>
			<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
			<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>
			<symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
			<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
			<symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></symbol>
			<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
			<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
			<symbol id="i-login" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></symbol>
			<symbol id="i-userplus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></symbol>
			<symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
			<symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
			<symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
			<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
			<symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></symbol>
			<symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></symbol>
		</defs>
	</svg>
	<header>
		<a href="/" class="logo" data-link aria-label="IRCart home"><img src="/static/logo.png" alt="" width="30" height="30"><span class="f4">I</span><span class="f8">R</span><span class="f9">C</span><span class="f11">a</span><span class="f12">r</span><span class="f13">t</span></a>
		<button id="menu" aria-label="menu" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
		<nav>
			<a href="/" title="Gallery" data-link><svg class="ic"><use href="#i-grid"/></svg><span class="lbl">Gallery</span></a>
			<a href="/uploads" title="Uploads" data-link><svg class="ic"><use href="#i-image"/></svg><span class="lbl">Uploads</span></a>
			<a href="/authors" title="Authors" data-link><svg class="ic"><use href="#i-users"/></svg><span class="lbl">Authors</span></a>
			<a href="/recent" title="Recent" data-link><svg class="ic"><use href="#i-clock"/></svg><span class="lbl">Recent</span></a>
			<a href="/random" title="Random"><svg class="ic"><use href="#i-shuffle"/></svg><span class="lbl">Random</span></a>
			<a href="/about" title="About" data-link><svg class="ic"><use href="#i-info"/></svg><span class="lbl">About</span></a>
			<a href="/admin/reports" title="Reports" data-link class="admin-only" hidden><svg class="ic"><use href="#i-flag"/></svg><span class="lbl">Reports</span><span id="report-count" class="badge" hidden></span></a>
			<a href="/admin" title="Admin" data-link class="admin-only" hidden><svg class="ic"><use href="#i-shield"/></svg><span class="lbl">Admin</span></a>
		</nav>
		<div id="account"></div>
	</header>

	<main id="page">{{ body | safe }}</main>

	<footer>
		IRCart - developed by <a href="https://github.com/acidvegas" target="_blank" rel="noopener" class="gh"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg> acidvegas</a>
	</footer>

	<div id="toast" hidden></div>

	<div id="clash" hidden>
		<div class="clash-box">
			<div class="clash-bar"><strong id="clash-title"></strong><button id="clash-close">OK</button></div>
			<div id="clash-list" class="side"></div>
		</div>
	</div>

	<script src="/static/utils.js"></script>
</body>
</html>
